name: Feature request
description: Propose a scoped product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not an implementation preference.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety, privacy, and permission considerations
      description: Note local data, credentials, external actions, costs, or confirmation requirements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
