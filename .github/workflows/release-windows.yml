name: Publish signed Windows release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: aevoren-windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-windows:
    if: github.repository == 'CMSKL/Aevoren-Bot' && vars.AEVOREN_WINDOWS_RELEASE_ENABLED == '1'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      AEVOREN_RELEASE_BUILD: "1"
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing required Windows signing secrets: WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD"
          }
      - run: pnpm install --frozen-lockfile
      - name: Verify version, channel and target branch
        id: release
        shell: pwsh
        run: node scripts/verify-release-version.mjs $env:GITHUB_REF_NAME
      - name: Verify branch order
        shell: pwsh
        env:
          EXPECTED_BRANCH: ${{ steps.release.outputs.expected_branch }}
        run: |
          $branch = $env:EXPECTED_BRANCH
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if ((git rev-parse HEAD) -ne (git rev-parse "origin/$branch")) { throw "Release tag is not based on the expected branch" }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "Release tag commit does not match GITHUB_SHA" }
      - run: pnpm open-source:check
      - run: pnpm verify
      - run: pnpm test:smoke
      - run: pnpm security:audit
      - name: Verify third-party notice is current
        shell: pwsh
        run: |
          pnpm licenses:generate
          if ((git diff --name-only -- THIRD_PARTY_NOTICES.md).Length -ne 0) { throw "THIRD_PARTY_NOTICES.md is stale" }
      - name: Build signed Windows installer
        run: pnpm release:win
      - name: Verify Windows release assets and generate checksums
        run: pnpm release:prepare:win
      - run: pnpm sbom:generate
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.blockmap
            dist/beta.yml
            dist/latest.yml
            dist/SHASUMS256-win.txt
            dist/aevoren-bot-sbom.cdx.json
      - name: Create or resume draft release
        shell: pwsh
        env:
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          $draft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne "true") { throw "Existing release is not a draft" }
          } else {
            $args = @("--draft", "--verify-tag", "--generate-notes", "--title", $env:GITHUB_REF_NAME)
            if ($env:RELEASE_TYPE -eq "prerelease") { $args += @("--prerelease", "--latest=false") }
            gh release create $env:GITHUB_REF_NAME @args
          }
      - name: Upload complete Windows release asset set
        shell: pwsh
        run: |
          $allowed = @(".exe", ".blockmap", "beta.yml", "latest.yml", "SHASUMS256-win.txt")
          $assets = @(Get-ChildItem dist -File | Where-Object { $allowed -contains $_.Extension -or $allowed -contains $_.Name } | ForEach-Object FullName)
          if ($assets.Count -lt 4) { throw "Windows release asset set is incomplete" }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
      - name: Verify uploaded release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aevoren-release-download" | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir "$env:RUNNER_TEMP\aevoren-release-download"
          Push-Location "$env:RUNNER_TEMP\aevoren-release-download"
          $checksums = Get-Content SHASUMS256-win.txt
          foreach ($line in $checksums) {
            $parts = $line -split "  ", 2
            if ($parts.Count -ne 2) { throw "Invalid checksum line" }
            $actual = (Get-FileHash -Algorithm SHA256 $parts[1]).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch for $($parts[1])" }
          }
          Pop-Location
          node scripts/verify-windows-release-assets.mjs "$env:RUNNER_TEMP\aevoren-release-download" ${{ steps.release.outputs.version }} x64
      - name: Confirm Windows assets are present in the shared release
        shell: pwsh
        env:
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          $release = gh release view $env:GITHUB_REF_NAME --json isDraft,isPrerelease,assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object name)
          $manifest = if ($env:RELEASE_TYPE -eq "prerelease") { "beta.yml" } else { "latest.yml" }
          foreach ($required in @("SHASUMS256-win.txt", $manifest)) {
            if ($names -notcontains $required) { throw "Shared release is missing $required" }
          }
