name: CI

on:
  pull_request:
  push:
    branches: [dev, beta, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify bounded macOS stapler network retry
        run: node --test scripts/finalize-notarized-macos-release.test.mjs
      - run: pnpm open-source:check
      - run: pnpm verify
      - name: Verify actual Linux Docker execution, browser and host tools
        timeout-minutes: 30
        env:
          AEVOREN_DOCKER_INTEGRATION: "1"
          AEVOREN_SKILL_DOCKER_TEST: "1"
          AEVOREN_WORKER_DOCKER_TEST: "1"
          AEVOREN_BROWSER_DOCKER_TEST: "1"
          AEVOREN_BROWSER_STARTUP_DIAGNOSTICS: "1"
          AEVOREN_BROWSER_DIAGNOSTICS: "1"
        run: |
          docker build --tag aevoren-worker-fixture:stage3 --tag aevoren-worker-fixture:stage2 out/worker
          docker build --tag aevoren-browser-fixture:stage3 out/browser-worker
          pnpm exec vitest run src/worker/docker-integration.test.ts src/worker/preview-proxy.docker.test.ts src/main/environment-service.integration.test.ts src/main/environment-product.integration.test.ts src/browser-worker/docker-integration.test.ts src/main/browser-service.integration.test.ts src/main/skill-execution-service.integration.test.ts --maxWorkers=1 --silent=false
      - run: pnpm security:audit
      - name: Verify third-party notice is current
        run: |
          pnpm licenses:generate
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

  macos:
    name: macOS smoke and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
      - run: pnpm package:mac
      - name: Validate library and Skills in the packaged macOS app
        shell: bash
        env:
          AEVOREN_BOT_TEST_HIDDEN: "1"
        run: |
          export AEVOREN_PACKAGED_APP_PATH="$PWD/dist/mac-arm64/Aevoren Bot.app/Contents/MacOS/Aevoren Bot"
          test -f "$AEVOREN_PACKAGED_APP_PATH"
          pnpm exec playwright test tests/smoke/library.spec.ts tests/smoke/native-connectors.spec.ts tests/smoke/native-outbound.spec.ts tests/smoke/demonstrations.spec.ts tests/smoke/mcp-apps.spec.ts
      - name: Validate close handshakes in the packaged macOS app
        env:
          AEVOREN_PACKAGED_APP_PATH: "${{ github.workspace }}/dist/mac-arm64/Aevoren Bot.app/Contents/MacOS/Aevoren Bot"
        run: pnpm exec playwright test tests/smoke/close-handshake.spec.ts
      - name: Preserve failed macOS UI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-ui-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5

  windows:
    name: Windows smoke and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bound worker contention so filesystem-backed Runtime checks can settle
      # on hosted Windows runners without weakening their completion assertions.
      - name: Verify isolated fixture teardown
        run: node --test scripts/fixture-close.test.mjs
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm build
      - name: Prepare Electron test runtime
        run: pnpm exec electron --version
      - name: Run Windows Electron smoke tests
        env:
          # GitHub-hosted Windows runners have no interactive desktop. The
          # Playwright Electron connection still exercises the full Renderer.
          AEVOREN_BOT_TEST_HIDDEN: "1"
        run: pnpm exec playwright test tests/smoke/windows-ci.spec.ts tests/smoke/p0-navigation.spec.ts tests/smoke/ui-redesign-acceptance.spec.ts tests/smoke/product-view.spec.ts tests/smoke/project-tools-followup.spec.ts tests/smoke/contact-focus.spec.ts tests/smoke/room-parallel.spec.ts tests/smoke/library.spec.ts tests/smoke/native-connectors.spec.ts tests/smoke/native-outbound.spec.ts tests/smoke/demonstrations.spec.ts tests/smoke/mcp-apps.spec.ts
      - name: Validate Windows close handshakes
        run: pnpm exec playwright test tests/smoke/close-handshake.spec.ts
      - run: pnpm package:win
      - name: Verify packaged Windows locale resources
        shell: pwsh
        run: |
          foreach ($locale in @("en-US.pak", "zh-CN.pak")) {
            $path = Join-Path "dist/win-unpacked/locales" $locale
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Missing or empty Windows locale: $locale" }
          }
      - name: Verify unsigned Windows installer artifact
        id: windows_installer
        shell: pwsh
        run: |
          $validationVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read package version" }
          node scripts/verify-release-version.mjs "v$validationVersion"
          if ($LASTEXITCODE -ne 0) { throw "Invalid installer version" }
          $validationHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $validationHead -ne $env:GITHUB_SHA) { throw "Installer checkout differs from the CI head" }
          $installers = @(Get-ChildItem dist -File -Filter "Aevoren-Bot-*.exe")
          if ($installers.Count -ne 1) { throw "Expected one Windows NSIS installer, found $($installers.Count)" }
          if ($installers[0].Length -le 0) { throw "Windows installer is empty" }
          if ($installers[0].Name -ne "Aevoren-Bot-${validationVersion}-x64.exe") { throw "Installer name differs from package version" }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status -ne "NotSigned") { throw "CI validation installer must be explicitly unsigned" }
          $validationSha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "head=$validationHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($installers[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$validationSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install and launch Windows package in isolation
        shell: pwsh
        env:
          CI_WINDOWS_INSTALLER_NAME: ${{ steps.windows_installer.outputs.name }}
        run: |
          $installer = Get-Item (Join-Path "dist" $env:CI_WINDOWS_INSTALLER_NAME)
          $installDir = Join-Path $env:RUNNER_TEMP "Aevoren Bot"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -NoNewWindow
          $app = Join-Path $installDir "Aevoren Bot.exe"
          if (!(Test-Path $app)) { throw "NSIS installer did not produce the application executable" }
          foreach ($locale in @("en-US.pak", "zh-CN.pak")) {
            $path = Join-Path (Join-Path $installDir "locales") $locale
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Installed Windows locale is missing or empty: $locale" }
          }
          $dataDir = Join-Path $env:RUNNER_TEMP "aevoren-windows-smoke-data"
          $env:AEVOREN_BOT_FAKE_PROVIDER = "1"
          $env:AEVOREN_BOT_TEST_HIDDEN = "1"
          $env:AEVOREN_BOT_USER_DATA_DIR = $dataDir
          $child = Start-Process -FilePath $app -ArgumentList @("--disable-gpu") -PassThru
          Start-Sleep -Seconds 8
          if ($child.HasExited) { throw "Installed Windows application exited during startup" }
          Stop-Process -Id $child.Id -Force
      - name: Validate both themes and avatar persistence in the installed Windows package
        shell: pwsh
        env:
          AEVOREN_BOT_TEST_HIDDEN: "1"
        run: |
          $env:AEVOREN_PACKAGED_APP_PATH = Join-Path $env:RUNNER_TEMP "Aevoren Bot/Aevoren Bot.exe"
          pnpm exec playwright test tests/smoke/ui-redesign-acceptance.spec.ts tests/smoke/product-view.spec.ts tests/smoke/project-tools-followup.spec.ts tests/smoke/contact-focus.spec.ts tests/smoke/room-parallel.spec.ts tests/smoke/library.spec.ts tests/smoke/native-connectors.spec.ts tests/smoke/native-outbound.spec.ts tests/smoke/demonstrations.spec.ts tests/smoke/mcp-apps.spec.ts
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows UI acceptance failed" }
      - name: Validate close handshakes in the installed Windows package
        env:
          AEVOREN_PACKAGED_APP_PATH: "${{ runner.temp }}/Aevoren Bot/Aevoren Bot.exe"
        run: pnpm exec playwright test tests/smoke/close-handshake.spec.ts
      - name: Prepare verified unsigned Windows validation download
        if: ${{ success() }}
        shell: pwsh
        env:
          CI_WINDOWS_INSTALLER_NAME: ${{ steps.windows_installer.outputs.name }}
          CI_WINDOWS_INSTALLER_VERSION: ${{ steps.windows_installer.outputs.version }}
          CI_WINDOWS_INSTALLER_HEAD: ${{ steps.windows_installer.outputs.head }}
          CI_WINDOWS_INSTALLER_SHA256: ${{ steps.windows_installer.outputs.sha256 }}
        run: |
          $validationInstaller = Get-Item (Join-Path "dist" $env:CI_WINDOWS_INSTALLER_NAME)
          $validationSha256 = (Get-FileHash $validationInstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($validationSha256 -ne $env:CI_WINDOWS_INSTALLER_SHA256) { throw "Installer bytes changed after installation acceptance" }
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/UNSIGNED-WINDOWS-SHASUMS256.txt"), "$validationSha256  $env:CI_WINDOWS_INSTALLER_NAME`n", [System.Text.UTF8Encoding]::new($false))
          @{ version = $env:CI_WINDOWS_INSTALLER_VERSION; head = $env:CI_WINDOWS_INSTALLER_HEAD; architecture = "x64"; signature = "NotSigned"; purpose = "manual-validation"; workflowRun = $env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content "dist/UNSIGNED-WINDOWS-BUILD.json" -Encoding utf8
      - name: Preserve verified unsigned Windows validation installer
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aevoren-bot-v${{ steps.windows_installer.outputs.version }}-windows-x64-unsigned-${{ steps.windows_installer.outputs.head }}-attempt${{ github.run_attempt }}
          path: |
            dist/${{ steps.windows_installer.outputs.name }}
            dist/UNSIGNED-WINDOWS-SHASUMS256.txt
            dist/UNSIGNED-WINDOWS-BUILD.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed Windows UI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
