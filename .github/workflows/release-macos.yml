name: Release signed macOS update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: aevoren-macos-release
  cancel-in-progress: false

jobs:
  release-macos:
    runs-on: macos-15
    env:
      AEVOREN_RELEASE_BUILD: "1"
      AEVOREN_UPDATE_BASE_URL: ${{ secrets.AEVOREN_UPDATE_BASE_URL }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AEVOREN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AEVOREN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AEVOREN_R2_ENDPOINT: ${{ secrets.AEVOREN_R2_ENDPOINT }}
      AEVOREN_R2_BUCKET: ${{ secrets.AEVOREN_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release inputs and branch order
        shell: bash
        run: |
          for name in AEVOREN_UPDATE_BASE_URL CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AEVOREN_R2_ENDPOINT AEVOREN_R2_BUCKET; do
            if [[ -z "${!name}" ]]; then echo "Missing required release secret: $name" >&2; exit 1; fi
          done
          git fetch origin '+refs/heads/dev:refs/remotes/origin/dev' '+refs/heads/beta:refs/remotes/origin/beta' '+refs/heads/master:refs/remotes/origin/master'
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            git merge-base --is-ancestor HEAD origin/beta
          else
            git merge-base --is-ancestor HEAD origin/master
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version and channel
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
      - name: Validate application
        run: pnpm validate
      - name: Build, sign and notarize update artifacts
        run: pnpm release:mac
      - name: Verify signature, Gatekeeper and notarization ticket
        shell: bash
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name 'Aevoren Bot.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then test -f dist/beta-mac.yml; else test -f dist/latest-mac.yml; fi
      - uses: actions/upload-artifact@v4
        with:
          name: aevoren-bot-${{ github.ref_name }}-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
      - name: Publish immutable artifacts and channel metadata
        shell: bash
        run: |
          command -v aws >/dev/null
          for file in dist/*.dmg dist/*.zip dist/*.blockmap; do
            [[ -e "$file" ]] || continue
            aws s3 cp "$file" "s3://${AEVOREN_R2_BUCKET}/$(basename "$file")" --endpoint-url "$AEVOREN_R2_ENDPOINT" --cache-control "public,max-age=31536000,immutable"
          done
          for file in dist/*-mac.yml; do
            [[ -e "$file" ]] || continue
            aws s3 cp "$file" "s3://${AEVOREN_R2_BUCKET}/$(basename "$file")" --endpoint-url "$AEVOREN_R2_ENDPOINT" --cache-control "no-cache,no-store,must-revalidate"
          done
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then metadata=beta-mac.yml; else metadata=latest-mac.yml; fi
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "${AEVOREN_UPDATE_BASE_URL%/}/${metadata}" --output "$RUNNER_TEMP/$metadata"
          cmp "dist/$metadata" "$RUNNER_TEMP/$metadata"
